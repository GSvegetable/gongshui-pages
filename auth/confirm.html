<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正在确认… | 宫水.com</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../styles/style.css?v=3.3.35">
<style>
.confirm-page{display:grid;place-items:center;min-height:100vh;padding:24px;color:#a99b82;font:900 12px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.4px;text-align:center}
.confirm-box{padding:26px 30px;border:3px solid #080808;border-radius:3px;background:#f5ecd9;color:#211d15;box-shadow:4px 5px 0 #080808}
.confirm-dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.confirm-dots i{width:9px;height:9px;background:#f4bd3c;border:2px solid #080808;border-radius:2px;animation:blink 1s infinite}
.confirm-dots i:nth-child(2){animation-delay:.18s}
.confirm-dots i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.confirm-dots i{animation:none;opacity:1}}
</style>
</head>
<body>
<main class="confirm-page">
  <div class="confirm-box">
    <div class="confirm-dots"><i></i><i></i><i></i></div>
    <div id="confirm-text">正在确认链接…</div>
  </div>
</main>
<script src="../scripts/auth-config.js?v=1.0.1"></script>
<script src="../scripts/auth.js?v=1.0.2"></script>
<script src="../scripts/auth-landing.js?v=1.0.0"></script>
</body>
</html>
