<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef2f7">
  <title>Gongshui · Links</title>
  <style>
    :root { color-scheme: light dark; --bg:#eef2f7; --panel:rgba(255,255,255,.72); --ink:#14213d; --muted:#64718a; --accent:#2f5bff; --line:rgba(20,33,61,.12); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:28px 18px; background:var(--bg); color:var(--ink); font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,760px); animation:rise .55s cubic-bezier(.2,.7,.2,1) both; }
    img { display:block; width:100%; height:auto; border-radius:16px; }
    h1 { margin:30px 0 7px; font-size:clamp(22px,4vw,30px); letter-spacing:-.04em; }
    p { margin:0 0 22px; color:var(--muted); line-height:1.6; }
    nav { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    a.option { display:flex; min-height:112px; flex-direction:column; justify-content:space-between; gap:12px; padding:20px; border:1px solid var(--line); border-radius:14px; background:var(--panel); color:inherit; text-decoration:none; transition:transform .2s ease,border-color .2s ease,background .2s ease; }
    a.option:hover { transform:translateY(-3px); border-color:var(--accent); }
    strong { font-size:17px; }
    small { color:var(--muted); font-size:13px; }
    .arrow { align-self:flex-end; color:var(--accent); font-size:20px; }
    @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    @media (max-width:520px) { nav { grid-template-columns:1fr; } a.option { min-height:88px; } }
    @media (prefers-color-scheme:dark) { :root { --bg:#0e1730; --panel:rgba(255,255,255,.06); --ink:#f2f5fb; --muted:#9aa8c7; --line:rgba(242,245,251,.14); --accent:#7c9bff; } }
    @media (prefers-reduced-motion:reduce) { main { animation:none; } a.option { transition:none; } }
  </style>
</head>
<body>
  <main>
    <img src="readme-banner.svg" alt="Rapidly evolving · X @gsyxyc">
    <h1>接下来想去哪里？</h1>
    <p>选择一个目的地继续浏览。</p>
    <nav aria-label="Choose a destination">
      <a class="option" href="https://x.com/gsyxyc" target="_blank" rel="noopener noreferrer">
        <strong>访问我的 X / Twitter</strong>
        <small>@gsyxyc · 打开社交主页</small>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="option" href="CHANGELOG.md">
        <strong>查看版本变更</strong>
        <small>阅读项目更新记录</small>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
  </main>
</body>
</html>
