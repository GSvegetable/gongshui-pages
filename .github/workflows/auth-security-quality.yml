name: Authentication security quality

on:
  pull_request:
    paths:
      - "scripts/auth.js"
      - "scripts/login-page.js"
      - "scripts/risk.js"
      - "scripts/fingerprint.js"
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/auth-security-quality.yml"

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check browser authentication scripts
        run: |
          node --check scripts/auth.js
          node --check scripts/login-page.js
          node --check scripts/risk.js
          node --check scripts/fingerprint.js
      - name: Type-check authentication Edge Functions
        run: |
          deno check supabase/functions/link-account/index.ts
          deno check supabase/functions/username-login/index.ts
          deno check supabase/functions/password-policy/index.ts
      - name: Verify critical hardening invariants
        run: |
          grep -q 'JSON.stringify({ email: authEmail, password })' supabase/functions/link-account/index.ts
          grep -q 'site-auth-session:' scripts/auth.js
          grep -q 'Only discard a refresh token when Auth explicitly rejects it' scripts/auth.js
          grep -q 'with check' supabase/migrations/20261126080235_optimize_auth_rls_policy_predicates.sql
