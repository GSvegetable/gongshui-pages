<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#171717">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>用户管理 · 宫水.com</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>宫</text></svg>">
  <link rel="stylesheet" href="./vendor/liquid-glass/liquid-glass.css?v=1.0.0">
  <link rel="stylesheet" href="./styles/admin.css?v=3.0.7">
  <script src="./scripts/privacy-cleanup.js?v=1.0.0"></script>
  <script type="module" src="./scripts/admin-liquid-glass.js?v=1.0.1"></script>
</head>
<body>
  <div class="console">
    <main class="sheet">
    <header class="topbar">
      <a class="brand liquid-glass" href="./index.html" aria-label="返回宫水首页">
        <span class="brand-name">宫水.com <em>管理台</em></span>
      </a>
      <div class="topbar-meta">
        <span id="admin-email" class="admin-email liquid-glass">正在验证权限</span>
        <button id="sign-out" class="btn btn-ghost btn-sm liquid-glass" type="button" hidden>退出登录</button>
      </div>
    </header>

      <header class="sheet-head">
        <div class="sheet-title">
          <p class="kicker">宫水.com · 账号登记簿</p>
          <h1>用户管理</h1>
        </div>
        <div class="sheet-tools">
          <span id="data-stamp" class="stamp">尚未读取数据</span>
          <button id="refresh" class="btn btn-solid" type="button">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a8 8 0 1 1-2.34-5.66"/><path d="M20 4v7h-7"/></svg>
            <span id="refresh-label">刷新数据</span>
          </button>
        </div>
      </header>

      <div id="notice" class="notice" role="status" hidden></div>

      <section class="ledger" aria-label="账号概览">
        <div class="ledger-item">
          <span class="ledger-label">注册用户</span>
          <strong id="stat-total" class="ledger-value">—</strong>
          <span class="ledger-note">全部账号</span>
        </div>
        <div class="ledger-item">
          <span class="ledger-label">今日新增</span>
          <strong id="stat-today" class="ledger-value">—</strong>
          <span class="ledger-note">UTC 自然日</span>
        </div>
        <div class="ledger-item">
          <span class="ledger-label">近 7 天登录</span>
          <strong id="stat-active" class="ledger-value">—</strong>
          <span class="ledger-note">最近登录在 7 天内</span>
        </div>
        <div class="ledger-item">
          <span class="ledger-label">待验证邮箱</span>
          <strong id="stat-unverified" class="ledger-value">—</strong>
          <span class="ledger-note">尚未完成验证</span>
        </div>
        <div class="ledger-item" id="stat-risk-item">
          <span class="ledger-label">高风险账号</span>
          <strong id="stat-risk" class="ledger-value">—</strong>
          <span class="ledger-note">注册风控标记</span>
        </div>
      </section>

      <section id="analytics" class="analytics" aria-label="近期数据" hidden>
        <article class="chart chart-wide">
          <div class="chart-head">
            <h2>近 30 天注册</h2>
            <span id="signup-total" class="chart-figure">—</span>
          </div>
          <div id="signup-bars" class="bars" role="img" aria-label="近 30 天每日注册用户柱状图"></div>
          <div class="chart-axis"><span>30 天前</span><span>15 天前</span><span>今天</span></div>
        </article>
        <article class="chart">
          <div class="chart-head"><h2>账号状态</h2></div>
          <div class="dual">
            <div class="dual-row"><span>可登录</span><strong id="account-available">—</strong></div>
            <div class="dual-row"><span>封禁中</span><strong id="account-banned">—</strong></div>
          </div>
          <div class="meter" role="img" aria-label="封禁账号占比"><span id="account-meter"></span></div>
          <p class="chart-note">封禁占比 <b id="account-banned-pct">—</b></p>
        </article>
        <article class="chart">
          <div class="chart-head">
            <h2>风险账号</h2>
            <span id="risk-percent" class="chart-figure is-alert">—</span>
          </div>
          <div class="meter" role="img" aria-label="高风险账号占比"><span id="risk-fill"></span></div>
          <div class="dual">
            <div class="dual-row"><span>高风险</span><strong id="risk-count">—</strong></div>
            <div class="dual-row"><span>正常</span><strong id="risk-normal">—</strong></div>
          </div>
        </article>
      </section>

      <section class="directory" aria-label="用户列表">
        <div class="directory-head">
          <div class="directory-title">
            <h2>全部用户</h2>
            <span id="result-count" class="count" aria-live="polite">等待数据</span>
          </div>
          <label class="search" for="search">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20.5 20.5"/></svg>
            <input id="search" type="search" placeholder="搜索用户名、邮箱或用户 ID" autocomplete="off" spellcheck="false">
          </label>
        </div>

        <div id="table-wrap" class="table-wrap">
          <table class="users-table">
            <thead>
              <tr>
                <th scope="col">用户</th>
                <th scope="col">注册时间</th>
                <th scope="col">最近登录</th>
                <th scope="col" class="num">收藏</th>
                <th scope="col">账号状态</th>
                <th scope="col">风控</th>
                <th scope="col"><span class="sr-only">查看详情</span></th>
              </tr>
            </thead>
            <tbody id="users-body">
              <tr><td colspan="7" class="loading-cell">正在读取用户数据…</td></tr>
            </tbody>
          </table>
        </div>

        <div class="pagination">
          <span id="page-label" class="page-label">—</span>
          <div class="page-actions">
            <button id="prev" class="btn btn-outline btn-sm" type="button" disabled>上一页</button>
            <button id="next" class="btn btn-outline btn-sm" type="button" disabled>下一页</button>
          </div>
        </div>
      </section>

      <footer class="sheet-foot">
        <span>宫水.com · 管理台</span>
        <span>仅限开发者白名单访问</span>
      </footer>
    </main>
  </div>

  <div id="detail-backdrop" class="scrim" hidden></div>
  <aside id="detail-panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="detail-title" tabindex="-1" hidden>
    <div class="panel-head">
      <div>
        <p class="kicker">宫水.com · 管理台</p>
        <h2 id="detail-title">用户档案</h2>
      </div>
      <button id="detail-close" class="icon-btn" type="button" aria-label="关闭详情">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6 18 18M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="detail-content" class="panel-body"></div>
  </aside>

  <div id="confirm-backdrop" class="scrim scrim-center" hidden>
    <div id="confirm-dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title" class="dialog-title">确认操作</h2>
      <p id="confirm-body" class="dialog-body"></p>
      <label id="confirm-field" class="dialog-field" hidden>
        <span id="confirm-field-label"></span>
        <input id="confirm-input" type="text" autocomplete="off" spellcheck="false">
      </label>
      <div class="dialog-actions">
        <button id="confirm-cancel" class="btn btn-outline" type="button">取消</button>
        <button id="confirm-ok" class="btn btn-solid" type="button">确认</button>
      </div>
    </div>
  </div>

  <script src="./scripts/auth-config.js?v=1.0.1"></script>
  <script src="./scripts/auth.js?v=1.0.5"></script>
  <script src="./scripts/admin.js?v=3.0.0"></script>
</body>
</html>
