<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101112">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>用户管理 · 宫水.com</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>宫</text></svg>">
  <link rel="stylesheet" href="./styles/admin.css?v=2.0.0">
  <script src="./scripts/privacy-cleanup.js?v=1.0.0"></script>
</head>
<body>
  <div class="admin-shell">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="返回宫水首页"><span class="brand-mark">宫</span><span class="brand-name">宫水<span>.com</span></span></a>
      <div class="topbar-meta"><span class="secure-mark"><i></i> PRIVATE CONSOLE</span><span class="topbar-divider"></span><span id="admin-email" class="admin-email">正在验证权限</span><button id="sign-out" class="text-button" type="button" hidden>退出登录</button></div>
    </header>

    <main class="main">
      <div class="heading-row">
        <div><div class="breadcrumb">CONTROL PANEL <span>/</span> ACCOUNTS</div><h1>用户管理</h1><p class="subtitle">查看账号、使用情况与安全状态。</p></div>
        <button id="refresh" class="refresh-button" type="button"><span aria-hidden="true">↻</span> 刷新数据</button>
      </div>
      <div id="notice" class="notice" role="status" hidden></div>

      <section class="metrics" aria-label="用户统计">
        <article class="metric"><span class="metric-label">注册用户</span><strong id="stat-total">—</strong><span class="metric-note">全部账号</span></article>
        <article class="metric"><span class="metric-label">今日新增</span><strong id="stat-today">—</strong><span class="metric-note">UTC 自然日</span></article>
        <article class="metric"><span class="metric-label">近 7 天活跃</span><strong id="stat-active">—</strong><span class="metric-note">有登录记录</span></article>
        <article class="metric"><span class="metric-label">待验证邮箱</span><strong id="stat-unverified">—</strong><span class="metric-note">尚未完成验证</span></article>
        <article class="metric metric-alert"><span class="metric-label">高风险账号</span><strong id="stat-risk">—</strong><span class="metric-note">风控标记</span></article>
      </section>

      <section class="directory">
        <div class="directory-head"><div><div class="section-kicker">DIRECTORY</div><h2>全部用户</h2></div><div id="result-count" class="result-count">等待数据</div></div>
        <div class="toolbar">
          <label class="search-field"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索用户名、邮箱或用户 ID" autocomplete="off"></label>
          <span class="sort-label">注册时间 <b>↓</b> 最新优先</span>
        </div>
        <div class="table-scroll">
          <table>
            <thead><tr><th>用户</th><th>注册时间</th><th>最近登录</th><th>收藏</th><th>账号状态</th><th>风控</th><th aria-label="详情"></th></tr></thead>
            <tbody id="users-body"><tr><td colspan="7" class="empty-cell">正在读取用户数据…</td></tr></tbody>
          </table>
        </div>
        <div class="pagination"><span id="page-label">—</span><div><button id="prev" class="page-button" type="button" disabled>上一页</button><button id="next" class="page-button" type="button" disabled>下一页</button></div></div>
      </section>
      <footer class="footer"><span>宫水.com <i>·</i> ADMIN</span><span>仅限开发者白名单访问</span></footer>
    </main>
  </div>

  <div id="detail-backdrop" class="detail-backdrop" hidden>
    <aside id="detail-panel" class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <div class="detail-top"><div><div class="section-kicker">USER RECORD</div><span class="detail-caption">账号档案</span></div><button id="detail-close" class="close-button" type="button" aria-label="关闭详情">×</button></div>
      <div id="detail-content" class="detail-content"><div class="detail-loading">正在读取用户档案…</div></div>
    </aside>
  </div>

  <script src="./scripts/auth-config.js?v=1.0.1"></script>
  <script src="./scripts/auth.js?v=1.0.5"></script>
  <script src="./scripts/admin.js?v=2.0.0"></script>
</body>
</html>
