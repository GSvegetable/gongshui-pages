<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Rapidly evolving / 活発に開発中 / 快速迭代 — X @gsyxyc" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Rapidly evolving · 活発に開発中 · 快速迭代 — X @gsyxyc</title>
  <style>
    .bg    { fill: #EEF2F7; }
    .ink   { fill: #14213D; }
    .soft  { fill: #5B6B88; }
    .accent{ fill: #2F5BFF; }
    text   { font-family: "Inter","SF Pro Display","Segoe UI",Helvetica,Arial,"Hiragino Sans","PingFang SC","Noto Sans CJK JP","Noto Sans JP","Microsoft YaHei",sans-serif; }
    .en    { font-size: 100px; font-weight: 800; letter-spacing: -2px; }
    .sub   { font-size: 42px; font-weight: 600; }
    .handle{ font-size: 26px; font-weight: 500; }
    .ghost { animation: settle 1.1s cubic-bezier(.2,.7,.2,1) both; }
    .g1 { opacity: .30; --s: 22px; }
    .g2 { opacity: .16; --s: 44px; animation-delay: .05s; }
    .g3 { opacity: .08; --s: 66px; animation-delay: .1s; }
    @keyframes settle { from { transform: translateX(var(--s)); } to { transform: translateX(0); } }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0E1730; }
      .ink   { fill: #F2F5FB; }
      .soft  { fill: #9AA8C7; }
      .accent{ fill: #7C9BFF; }
    }
    @media (prefers-reduced-motion: reduce) { .ghost { animation: none; } }
  </style>

  <rect class="bg" width="1200" height="380" rx="20"/>

  <!-- motion trails: earlier iterations fading behind the current one -->
  <g class="accent">
    <text class="en ghost g3" x="34" y="190">Rapidly evolving</text>
    <text class="en ghost g2" x="56" y="190">Rapidly evolving</text>
    <text class="en ghost g1" x="78" y="190">Rapidly evolving</text>
  </g>
  <text class="en ink" x="100" y="190">Rapidly evolving</text>

  <!-- Japanese + Chinese -->
  <rect class="accent" x="100" y="232" width="6" height="52" rx="3"/>
  <text class="sub ink" x="126" y="272" xml:lang="ja" lang="ja">活発に開発中</text>
  <text class="sub soft" x="470" y="272" xml:lang="zh" lang="zh">快速迭代</text>

  <!-- handle -->
  <text class="handle soft" x="1100" y="336" text-anchor="end">X  @gsyxyc</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
