<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171717">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://izvdwjqixnhsxskjsolq.supabase.co; frame-src 'none'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<title>账号 | 宫水.com</title>
<meta name="description" content="宫水.com 的账号入口。">
<link rel="stylesheet" href="./styles/style.css?v=2.10.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<style>
.auth-page{width:min(420px,calc(100% - 32px));margin:0 auto;padding:clamp(28px,7vh,72px) 0 60px}

.auth-nav{display:flex;justify-content:flex-end;align-items:center;gap:16px;padding-bottom:14px;border-bottom:3px solid #080808;color:#a99b82;font:900 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3px}
.auth-nav a{color:#f4bd3c;text-decoration:none}
.auth-nav a:hover{color:#ffd36a}
.auth-lang{appearance:none;min-width:40px;height:28px;padding:0 9px;border:2px solid #080808;border-radius:2px;background:#f4bd3c;color:#211d15;font:900 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:2px 3px 0 #000;cursor:pointer}
.auth-lang:active{transform:translate(2px,3px);box-shadow:none}

.auth-card{margin-top:34px;border:3px solid #080808;border-radius:3px;background:#f5ecd9;box-shadow:4px 5px 0 #080808;overflow:hidden}
.auth-head{display:flex;align-items:center;gap:13px;padding:16px 16px 14px;border-bottom:3px solid #080808;background:#efe6d2}
.auth-block{display:grid;place-items:center;width:44px;height:44px;flex:0 0 auto;border:3px solid #34220e;border-radius:3px;background:#f4bd3c;color:#211d15;box-shadow:0 4px 0 #a85f10}
.auth-block svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.auth-head-text{display:flex;flex-direction:column;gap:5px;min-width:0}
.auth-kicker{color:#a2701a;font:900 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2.2px}
.auth-title{margin:0;color:#211d15;font-size:19px;font-weight:900;letter-spacing:-.4px}

.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:3px solid #080808}
.auth-tabs[hidden]{display:none}
.auth-tab{appearance:none;margin:0;padding:13px 8px;border:0;border-right:3px solid #080808;background:#e7dcc4;color:#6b5d47;font:900 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.4px;cursor:pointer;transition:background .15s,color .15s}
.auth-tab:last-child{border-right:0}
.auth-tab:hover{background:#f0e7d3;color:#211d15}
.auth-tab.is-active{background:#f4bd3c;color:#211d15}

.auth-social{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:16px 16px 0}
.auth-social[hidden],.auth-divider[hidden]{display:none}
.auth-social-btn{display:flex;align-items:center;justify-content:center;gap:9px;min-width:0;height:42px;padding:0 9px;border:2px solid #211d15;border-radius:3px;background:#fffdf7;color:#211d15;font:900 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer;transition:background .15s,transform .1s}
.auth-social-btn:hover{background:#f4bd3c}
.auth-social-btn:active{transform:translateY(1px)}
.auth-social-btn:disabled{opacity:.55;cursor:wait}
.auth-social-btn svg{width:17px;height:17px;flex:0 0 auto}
.auth-divider{display:flex;align-items:center;gap:10px;padding:15px 16px 0;color:#8a7a60;font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px}
.auth-divider::before,.auth-divider::after{content:"";height:1px;flex:1;background:rgba(41,35,25,.2)}
.auth-form{padding:18px 16px 16px;display:grid;gap:14px}
.auth-field{display:grid;gap:7px}
.auth-field[hidden]{display:none}
.auth-field label{color:#5c4b32;font:900 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.4px}
.auth-field input{
  width:100%;height:42px;padding:0 11px;border:2px solid #211d15;border-radius:3px;
  background:#fffdf7;color:#211d15;font:700 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  outline:0;appearance:none;transition:box-shadow .15s,border-color .15s;
}
.auth-field input:focus{border-color:#f4bd3c;box-shadow:0 0 0 3px rgba(244,189,60,.28)}
.auth-field input::placeholder{color:#a89b82;font-weight:500}
.auth-code-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.auth-code-row input{min-width:0}
.auth-resend{height:42px;padding:0 10px;border:2px solid #211d15;border-radius:3px;background:#e7dcc4;color:#51432e;font:900 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;cursor:pointer}
.auth-resend:disabled{opacity:.5;cursor:wait}

.auth-submit{appearance:none;width:100%;height:46px;margin-top:2px;border:3px solid #080808;border-radius:3px;background:#f4bd3c;color:#211d15;font:900 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.6px;cursor:pointer;box-shadow:3px 4px 0 #080808;transition:transform .1s,box-shadow .1s,background .15s}
.auth-submit:hover{background:#ffd36a}
.auth-submit:active{transform:translate(3px,4px);box-shadow:none}
.auth-submit[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}

.auth-message{margin:0;padding:10px 11px;border:2px solid #b5402a;border-radius:3px;background:#fbe9e3;color:#8c2f1e;font:700 11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
.auth-message[hidden]{display:none}
.auth-message.is-ok{border-color:#5c7a54;background:#eaf0e6;color:#3f5738}

.auth-extra{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center}
.auth-extra[hidden]{display:none}
.auth-link{appearance:none;padding:0;border:0;background:none;color:#8a6a1c;font:700 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.auth-link:hover{color:#211d15}

.auth-mode{margin:14px 0 0;padding:10px 11px;border:2px dashed rgba(41,35,25,.35);border-radius:3px;color:#6b5d47;font:700 10px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2px}
.auth-foot{margin-top:22px;text-align:center;color:#827969;font:700 11px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace}
.auth-foot a{color:#f4bd3c;text-decoration:none}
.auth-foot a:hover{color:#ffd36a}
.privacy-note{margin:16px 0 0;padding:12px 13px;border:1px solid rgba(41,35,25,.25);border-radius:3px;background:rgba(245,236,217,.72);color:#5c4b32;font:600 11px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace}
.privacy-note summary{cursor:pointer;font-weight:900;color:#51432e}
.privacy-note p{margin:9px 0 0}
.privacy-note a{color:#8a6a1c;font-weight:900}
</style>
<script src="./scripts/privacy-cleanup.js?v=1.0.0"></script>
</head>
<body>
<main class="auth-page">
  <nav class="auth-nav">
    <span style="display:flex;align-items:center;gap:12px">
      <a href="./index.html" data-i18n="backHome">返回首页　↗</a>
      <button class="auth-lang" id="auth-lang" type="button">EN</button>
    </span>
  </nav>

  <section class="auth-card" aria-labelledby="auth-title">
    <header class="auth-head">
      <div class="auth-block" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8.4" r="3.6"></circle><path d="M4.6 20c0-3.6 3.3-6.2 7.4-6.2s7.4 2.6 7.4 6.2"></path></svg>
      </div>
      <div class="auth-head-text">
        <h1 class="auth-title" id="auth-title">登录</h1>
      </div>
    </header>

    <div class="auth-tabs" id="auth-tabs" role="tablist" aria-label="登录或注册">
      <button class="auth-tab is-active" type="button" role="tab" id="tab-signin" aria-selected="true" data-mode="signin" data-i18n="tabSignin">登录</button>
      <button class="auth-tab" type="button" role="tab" id="tab-signup" aria-selected="false" data-mode="signup" data-i18n="tabSignup">注册</button>
    </div>

    <div class="auth-social" id="auth-social" aria-label="第三方登录">
      <button class="auth-social-btn" id="auth-google" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.23c0-.72-.06-1.42-.19-2.1H12v3.98h5.38a4.6 4.6 0 0 1-2 3.02v2.48h3.23c1.89-1.74 2.99-4.3 2.99-7.38Z"/><path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.62-2.4l-3.23-2.48c-.9.6-2.05.96-3.39.96-2.6 0-4.8-1.75-5.59-4.1H3.08v2.56A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.41 13.98A6 6 0 0 1 6.1 12c0-.69.12-1.36.32-1.98V7.46H3.08A10 10 0 0 0 2 12c0 1.62.39 3.15 1.08 4.54l3.33-2.56Z"/><path fill="#EA4335" d="M12 5.92c1.47 0 2.79.5 3.83 1.5l2.87-2.87C16.96 2.96 14.7 2 12 2a10 10 0 0 0-8.92 5.46l3.34 2.56c.79-2.35 2.99-4.1 5.58-4.1Z"/></svg>
        <span data-i18n="continueGoogle">使用 Google 继续</span>
      </button>
      <button class="auth-social-btn" id="auth-github" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.54v-2.1c-3.1.67-3.76-1.32-3.76-1.32-.5-1.28-1.23-1.62-1.23-1.62-1.01-.69.08-.68.08-.68 1.12.08 1.7 1.15 1.7 1.15.99 1.69 2.6 1.2 3.23.92.1-.72.39-1.2.7-1.48-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.21 1.15-2.99-.12-.28-.5-1.42.11-2.95 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.53.23 2.67.11 2.95.72.78 1.15 1.77 1.15 2.99 0 4.29-2.61 5.23-5.1 5.51.4.35.75 1.03.75 2.08v3.08c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/></svg>
        <span data-i18n="continueGithub">使用 GitHub 继续</span>
      </button>
    </div>
    <div class="auth-divider" id="auth-divider"><span data-i18n="orEmail">或使用邮箱</span></div>

    <form class="auth-form" id="auth-form" novalidate>
      <div class="auth-field" id="auth-email-field">
        <label for="auth-email" data-i18n="emailOrUsername">邮箱 / 用户名</label>
        <input type="text" id="auth-email" name="email" placeholder="name@example.com" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </div>
      <div class="auth-field" id="auth-username-field" hidden>
        <label for="auth-username" data-i18n="username">用户名</label>
        <input type="text" id="auth-username" name="username" placeholder="4–9 位用户名" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      </div>
      <div class="auth-field" id="auth-code-field" hidden>
        <label for="auth-code" data-i18n="verificationCode">邮箱验证码</label>
        <div class="auth-code-row">
          <input type="text" id="auth-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="输入 6 位验证码">
          <button class="auth-resend" type="button" id="auth-resend" data-i18n="resend">重新发送</button>
        </div>
      </div>
      <div class="auth-field">
        <label for="auth-password" data-i18n="password">密码</label>
        <input type="password" id="auth-password" name="password" placeholder="至少 6 位" autocomplete="current-password" minlength="6" required>
      </div>
      <p class="auth-message" id="auth-message" role="status" aria-live="polite" hidden></p>
      <button class="auth-submit" type="submit" id="auth-submit">进入</button>
      <div class="auth-extra" id="auth-extra">
        <button class="auth-link" type="button" id="auth-forgot" data-i18n="forgot">忘记密码？</button>
      </div>
    </form>
  </section>

  <p class="privacy-note"><a href="./privacy.html" data-i18n="privacyLink">隐私政策与数据处理说明 ↗</a></p>
</main>

<script src="./scripts/fingerprint.js?v=1.1.0"></script>
<script src="./scripts/auth-config.js?v=1.0.1"></script>
<script src="./scripts/auth.js?v=1.1.6"></script>
<script src="./scripts/risk.js?v=1.0.4"></script>
<script src="./scripts/login-page.js?v=1.0.2"></script>
</body>
</html>
