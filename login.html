<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171717">
<title>账号 | 宫水.com</title>
<meta name="description" content="宫水.com 的账号入口。">
<link rel="stylesheet" href="./styles/style.css?v=2.6.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<style>
.auth-page{width:min(420px,calc(100% - 32px));margin:0 auto;padding:clamp(28px,7vh,72px) 0 60px}

.auth-nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:14px;border-bottom:3px solid #080808;color:#a99b82;font:900 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3px}
.auth-nav a{color:#f4bd3c;text-decoration:none}
.auth-nav a:hover{color:#ffd36a}
.auth-lang{appearance:none;min-width:40px;height:28px;padding:0 9px;border:2px solid #080808;border-radius:2px;background:#f4bd3c;color:#211d15;font:900 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:2px 3px 0 #000;cursor:pointer}
.auth-lang:active{transform:translate(2px,3px);box-shadow:none}

.auth-card{margin-top:34px;border:3px solid #080808;border-radius:3px;background:#f5ecd9;box-shadow:4px 5px 0 #080808;overflow:hidden}
.auth-head{display:flex;align-items:center;gap:13px;padding:16px 16px 14px;border-bottom:3px solid #080808;background:#efe6d2}
.auth-block{display:grid;place-items:center;width:44px;height:44px;flex:0 0 auto;border:3px solid #34220e;border-radius:3px;background:#f4bd3c;color:#211d15;box-shadow:0 4px 0 #a85f10}
.auth-block svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.auth-head-text{display:flex;flex-direction:column;gap:5px;min-width:0}
.auth-kicker{color:#a2701a;font:900 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2.2px}
.auth-title{margin:0;color:#211d15;font-size:19px;font-weight:900;letter-spacing:-.4px}

.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:3px solid #080808}
.auth-tabs[hidden]{display:none}
.auth-tab{appearance:none;margin:0;padding:13px 8px;border:0;border-right:3px solid #080808;background:#e7dcc4;color:#6b5d47;font:900 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.4px;cursor:pointer;transition:background .15s,color .15s}
.auth-tab:last-child{border-right:0}
.auth-tab:hover{background:#f0e7d3;color:#211d15}
.auth-tab.is-active{background:#f4bd3c;color:#211d15}

.auth-form{padding:18px 16px 16px;display:grid;gap:14px}
.auth-field{display:grid;gap:7px}
.auth-field[hidden]{display:none}
.auth-field label{color:#5c4b32;font:900 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.4px}
.auth-field input{
  width:100%;height:42px;padding:0 11px;border:2px solid #211d15;border-radius:3px;
  background:#fffdf7;color:#211d15;font:700 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
  outline:0;appearance:none;transition:box-shadow .15s,border-color .15s;
}
.auth-field input:focus{border-color:#f4bd3c;box-shadow:0 0 0 3px rgba(244,189,60,.28)}
.auth-field input::placeholder{color:#a89b82;font-weight:500}

.auth-submit{appearance:none;width:100%;height:46px;margin-top:2px;border:3px solid #080808;border-radius:3px;background:#f4bd3c;color:#211d15;font:900 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.6px;cursor:pointer;box-shadow:3px 4px 0 #080808;transition:transform .1s,box-shadow .1s,background .15s}
.auth-submit:hover{background:#ffd36a}
.auth-submit:active{transform:translate(3px,4px);box-shadow:none}
.auth-submit[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}

.auth-message{margin:0;padding:10px 11px;border:2px solid #b5402a;border-radius:3px;background:#fbe9e3;color:#8c2f1e;font:700 11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
.auth-message[hidden]{display:none}
.auth-message.is-ok{border-color:#5c7a54;background:#eaf0e6;color:#3f5738}

.auth-extra{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center}
.auth-extra[hidden]{display:none}
.auth-link{appearance:none;padding:0;border:0;background:none;color:#8a6a1c;font:700 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.auth-link:hover{color:#211d15}

.auth-mode{margin:14px 0 0;padding:10px 11px;border:2px dashed rgba(41,35,25,.35);border-radius:3px;color:#6b5d47;font:700 10px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2px}
.auth-foot{margin-top:22px;text-align:center;color:#827969;font:700 11px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace}
.auth-foot a{color:#f4bd3c;text-decoration:none}
.auth-foot a:hover{color:#ffd36a}
</style>
</head>
<body>
<main class="auth-page">
  <nav class="auth-nav">
    <span>宫水.com　/　账号</span>
    <span style="display:flex;align-items:center;gap:12px">
      <a href="./index.html" data-i18n="backHome">返回首页　↗</a>
      <button class="auth-lang" id="auth-lang" type="button">EN</button>
    </span>
  </nav>

  <section class="auth-card" aria-labelledby="auth-title">
    <header class="auth-head">
      <div class="auth-block" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8.4" r="3.6"></circle><path d="M4.6 20c0-3.6 3.3-6.2 7.4-6.2s7.4 2.6 7.4 6.2"></path></svg>
      </div>
      <div class="auth-head-text">
        <p class="auth-kicker">ACCOUNT</p>
        <h1 class="auth-title" id="auth-title">登录</h1>
      </div>
    </header>

    <div class="auth-tabs" id="auth-tabs" role="tablist" aria-label="登录或注册">
      <button class="auth-tab is-active" type="button" role="tab" id="tab-signin" aria-selected="true" data-mode="signin" data-i18n="tabSignin">登录</button>
      <button class="auth-tab" type="button" role="tab" id="tab-signup" aria-selected="false" data-mode="signup" data-i18n="tabSignup">注册</button>
    </div>

    <form class="auth-form" id="auth-form" novalidate>
      <div class="auth-field" id="auth-email-field">
        <label for="auth-email" data-i18n="username">用户名</label>
        <input type="text" id="auth-email" name="username" placeholder="3-24 位，字母数字下划线" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </div>
      <div class="auth-field">
        <label for="auth-password" data-i18n="password">密码</label>
        <input type="password" id="auth-password" name="password" placeholder="至少 6 位" autocomplete="current-password" minlength="6" required>
      </div>
      <p class="auth-message" id="auth-message" role="status" aria-live="polite" hidden></p>
      <button class="auth-submit" type="submit" id="auth-submit">进入</button>
      <div class="auth-extra" id="auth-extra">
        <button class="auth-link" type="button" id="auth-forgot" data-i18n="forgot">忘记密码？</button>
        <button class="auth-link" type="button" id="auth-resend" hidden data-i18n="resend">重新发送确认邮件</button>
      </div>
    </form>

    <p class="auth-mode" id="auth-mode"></p>
  </section>

  <p class="auth-foot"><span data-i18n="foot">登录后，收藏和偏好会跟着账号走。</span><br><a href="./index.html" data-i18n="footLink">← 回到作品主页</a></p>
</main>

<script src="./scripts/vendor/fingerprintjs.min.js?v=3.4.2"></script>
<script src="./scripts/fingerprint.js?v=1.0.1"></script>
<script src="./scripts/auth-config.js?v=1.0.1"></script>
<script src="./scripts/auth.js?v=1.0.3"></script>
<script src="./scripts/risk.js?v=1.0.2"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const form = $('auth-form');
  const emailInput = $('auth-email');
  const passwordInput = $('auth-password');
  const message = $('auth-message');
  const submit = $('auth-submit');
  const title = $('auth-title');
  const modeNote = $('auth-mode');
  const tabs = $('auth-tabs');
  const emailField = $('auth-email-field');
  const extra = $('auth-extra');
  const forgotBtn = $('auth-forgot');
  const resendBtn = $('auth-resend');
  const langBtn = $('auth-lang');

  let mode = 'signin';     // 'signin' | 'signup'
  let recovery = false;    // 从重置密码邮件链接进来
  let lang = 'zh';

  const I18N = {
    zh: {
      backHome: '返回首页　↗', tabSignin: '登录', tabSignup: '注册',
      username: '用户名', password: '密码',
      titleSignin: '登录', titleSignup: '注册', titleRecovery: '设置新密码',
      enter: '进入', create: '创建账号', save: '保存新密码',
      signingIn: '登录中…', creating: '创建中…', saving: '保存中…',
      forgot: '忘记密码？', resend: '重新发送确认邮件',
      placeholderPwd: '至少 6 位', placeholderPwdSignin: '你的密码',
      modeCloud: '云端账号：数据存在账号服务里，换设备也能登录。',
      highRisk: '这台设备 24 小时内注册了太多账号，这个账号的收藏和偏好同步会被停用。',
      modeLocal: '本地模式：账号只存在这台设备上（还没接云端账号服务）。',
      needConfirm: '注册成功，去收件箱点一下确认链接再来登录。',
      resendOk: '确认邮件已重发，去收件箱看看。',
      resetSent: '重置密码的邮件已发送，去查收。',
      pwdUpdated: '密码已改好，正在回主页…',
      signedIn: '成功，正在回主页…',
      errEmail: '先填用户名', errEmailFormat: '用户名要 3-24 位，只能用字母、数字、下划线和短横线', errPwd: '密码至少要 6 位',
      recoveryOk: '链接已生效，设个新密码吧',
      foot: '登录后，收藏和偏好会跟着账号走。', footLink: '← 回到作品主页'
    },
    en: {
      backHome: 'Back to home ↗', tabSignin: 'Sign in', tabSignup: 'Sign up',
      username: 'Username', password: 'Password',
      titleSignin: 'Sign in', titleSignup: 'Sign up', titleRecovery: 'Set a new password',
      enter: 'Enter', create: 'Create account', save: 'Save password',
      signingIn: 'Signing in…', creating: 'Creating…', saving: 'Saving…',
      forgot: 'Forgot password?', resend: 'Resend confirmation email',
      placeholderPwd: 'At least 6 characters', placeholderPwdSignin: 'Your password',
      modeCloud: 'Cloud account: data lives in the account service, so you can sign in from any device.',
      highRisk: 'Too many accounts were created from this device in 24 hours, so bookmark and preference sync is disabled for this account.',
      modeLocal: 'Local mode: accounts only exist on this device (no cloud account service connected yet).',
      needConfirm: 'Account created. Check your email for the confirmation link, then come back to sign in.',
      resendOk: 'Confirmation email sent again — check your inbox.',
      resetSent: 'Password reset email sent — check your inbox.',
      pwdUpdated: 'Password updated. Heading back…',
      signedIn: 'Signed in. Heading back…',
      errEmail: 'Enter a username first',
      errEmailFormat: 'Username needs 3-24 characters: letters, numbers, _ or -',
      errPwd: 'Password needs at least 6 characters',
      recoveryOk: 'Link accepted — set a new password.',
      foot: 'Once you sign in, bookmarks and preferences travel with your account.',
      footLink: '← Back to the gallery'
    }
  };

  const t = key => (I18N[lang] && I18N[lang][key]) || I18N.zh[key] || key;

  const show = (text, ok) => {
    message.textContent = text || '';
    message.hidden = !text;
    message.classList.toggle('is-ok', !!ok);
  };

  const applyLang = () => {
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
    document.querySelectorAll('[data-i18n]').forEach(node => {
      node.textContent = t(node.dataset.i18n);
    });
    langBtn.textContent = lang === 'en' ? '中' : 'EN';
    render();
  };

  langBtn.addEventListener('click', () => { lang = lang === 'en' ? 'zh' : 'en'; applyLang(); });

  const submitLabel = () => {
    if (recovery) return t('save');
    return mode === 'signup' ? t('create') : t('enter');
  };

  const render = () => {
    if (recovery) {
      title.textContent = t('titleRecovery');
      emailField.hidden = true;
      tabs.hidden = true;
      passwordInput.setAttribute('autocomplete', 'new-password');
      passwordInput.placeholder = t('placeholderPwd');
      forgotBtn.hidden = true;
    } else {
      title.textContent = mode === 'signup' ? t('titleSignup') : t('titleSignin');
      emailField.hidden = false;
      tabs.hidden = false;
      passwordInput.setAttribute('autocomplete', mode === 'signup' ? 'new-password' : 'current-password');
      passwordInput.placeholder = mode === 'signup' ? t('placeholderPwd') : t('placeholderPwdSignin');
      forgotBtn.hidden = mode === 'signup';
    }
    if (!submit.disabled) submit.textContent = submitLabel();
  };

  tabs.querySelectorAll('.auth-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      mode = tab.dataset.mode;
      tabs.querySelectorAll('.auth-tab').forEach(other => {
        const on = other === tab;
        other.classList.toggle('is-active', on);
        other.setAttribute('aria-selected', String(on));
      });
      resendBtn.hidden = true;
      show('');
      render();
    });
  });

  // 账号服务没配好时，本地模式照样能把流程走通
  modeNote.textContent = window.siteAuth && window.siteAuth.isConfigured ? t('modeCloud') : t('modeLocal');

  forgotBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    if (!email) return show(t('errEmail'));
    if (!window.siteAuth.usernamePattern.test(email)) return show(t('errEmailFormat'));
    try {
      await window.siteAuth.requestReset(email);
      show(t('resetSent'), true);
    } catch (error) {
      show(error && error.message ? error.message : '出了点问题，再试一次');
    }
  });

  resendBtn.addEventListener('click', async () => {
    const email = emailInput.value.trim();
    if (!email) return show(t('errEmail'));
    resendBtn.disabled = true;
    try {
      await window.siteAuth.resendConfirmation(email);
      show(t('resendOk'), true);
    } catch (error) {
      show(error && error.message ? error.message : '出了点问题，再试一次');
    }
    resendBtn.disabled = false;
  });

  form.addEventListener('submit', async event => {
    event.preventDefault();
    show('');

    if (recovery) {
      const password = passwordInput.value;
      if (password.length < 6) return show(t('errPwd'));
      submit.disabled = true;
      submit.textContent = t('saving');
      try {
        await window.siteAuth.updatePassword(password);
        show(t('pwdUpdated'), true);
        setTimeout(() => { location.href = './index.html'; }, 900);
      } catch (error) {
        show(error && error.message ? error.message : '出了点问题，再试一次');
        submit.disabled = false;
        render();
      }
      return;
    }

    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email) return show(t('errEmail'));
    if (!window.siteAuth.usernamePattern.test(email)) return show(t('errEmailFormat'));
    if (password.length < 6) return show(t('errPwd'));

    submit.disabled = true;
    submit.textContent = mode === 'signup' ? t('creating') : t('signingIn');
    try {
      const payload = mode === 'signup'
        ? await window.siteAuth.signUp({ email, password })
        : await window.siteAuth.signIn({ email, password });
      if (payload.needConfirm) {
        show(t('needConfirm'), true);
        resendBtn.hidden = false;
        submit.disabled = false;
        render();
        return;
      }
      // 登记一条风控记录（指纹 + 服务端记的 IP），并让服务端判一次
      if (window.siteRisk) {
        try {
          await window.siteRisk.record(payload.userId, payload.username);
          await window.siteRisk.evaluate();
        } catch (_) {}
        if (window.siteRisk.highRisk) {
          show(t('highRisk'), false);
          submit.disabled = false;
          render();
          return;
        }
      }
      show(t('signedIn'), true);
      setTimeout(() => { location.href = './index.html'; }, 700);
    } catch (error) {
      show(error && error.message ? error.message : '出了点问题，再试一次');
      submit.disabled = false;
      render();
    }
  });

  // 页面加载：先接住邮件链接里带回来的令牌
  window.siteAuth.restore().then(account => {
    let kind = window.siteAuth.redirect && window.siteAuth.redirect.type;
    if (!kind) {
      try { kind = sessionStorage.getItem('site-auth-redirect'); } catch (_) {}
    }
    if (kind) { try { sessionStorage.removeItem('site-auth-redirect'); } catch (_) {} }
    if (kind === 'recovery') {
      recovery = true;
      render();
      show(t('recoveryOk'), true);
      passwordInput.focus();
      return;
    }
    if (window.siteRisk) {
      window.siteRisk.status().then(risk => {
        if (risk) show(t('highRisk'), false);
      });
    }
    if (account && (account.username || account.email)) location.replace('./index.html');
  });

  applyLang();
})();
</script>
</body>
</html>
