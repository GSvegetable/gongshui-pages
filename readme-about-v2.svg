<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="一个展示作品与网页交互的实验空间，点击查看项目目录">
  <title>一个展示作品与网页交互的实验空间 · 点击查看项目目录</title>
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="0.58" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="panel"><rect width="1200" height="360" rx="20"/></clipPath>
  </defs>
  <style>
    .bg { fill: #EEF2F7; }
    .ink { fill: #14213D; }
    .soft { fill: #5B6B88; }
    text { font-family: "Inter","SF Pro Display","Segoe UI",Helvetica,Arial,"Hiragino Sans","PingFang SC","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif; }
    .desc { font-size: 34px; font-weight: 600; letter-spacing: .2px; }
    .hint { font-size: 23px; font-weight: 500; letter-spacing: 1px; }
    .shine { fill: url(#shine); }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0E1730; }
      .ink { fill: #F2F5FB; }
      .soft { fill: #9AA8C7; }
      .shine { opacity: .58; }
    }
    @media (prefers-reduced-motion: reduce) { .shine-group { display: none; } }
  </style>
  <g clip-path="url(#panel)">
    <rect class="bg" width="1200" height="360"/>
    <text class="desc ink" x="80" y="164" xml:lang="zh" lang="zh">一个展示作品与网页交互的实验空间</text>
    <rect x="80" y="207" width="5" height="32" rx="2.5" fill="#2F5BFF"/>
    <text class="hint soft" x="104" y="232" xml:lang="zh" lang="zh">点击查看项目目录</text>
    <g class="shine-group" opacity=".9">
      <g transform="rotate(-18 600 180)">
        <rect class="shine" x="-1500" y="-500" width="150" height="1400">
          <animateTransform attributeName="transform" type="translate"
            values="-1800 0;0 0;1800 0" keyTimes="0;0.5;1"
            keySplines="0.22 0.72 0.32 1;0.68 0 0.78 0.28"
            calcMode="spline" dur="5.8s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</svg>
