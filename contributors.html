<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171717">
<title>创作名单 | 宫水.com</title>
<link rel="stylesheet" href="./styles/style.css?v=3.3.8">
<style>
.credits-page{width:min(820px,calc(100% - 40px));margin:0 auto;padding:clamp(42px,9vh,88px) 0 60px}
.credits-nav{display:flex;justify-content:space-between;align-items:center;padding-bottom:13px;border-bottom:1px solid #514735;color:#a99b82;font:11px/1.4 ui-monospace,monospace;letter-spacing:.8px}
.credits-nav a{color:#eab64b;text-decoration:none}
.credits-nav a:hover{color:#fff0c9}
.credits-heading{margin:52px 0 35px}
.credits-eyebrow{margin:0 0 12px;color:#d6a33d;font-size:11px;font-weight:800;letter-spacing:2px}
.credits-heading h1{margin:0;color:#f5ecd9;font-size:clamp(34px,6vw,54px);font-weight:850;letter-spacing:-1.8px;line-height:1.1}
.credits-heading p:last-child{max-width:470px;margin:17px 0 0;color:#b8aa92;font-size:13px;line-height:1.9}
.credits-list{border-top:2px solid #d0b078}
.credits-row{display:grid;grid-template-columns:64px minmax(150px,1fr) minmax(180px,1.2fr);align-items:center;gap:18px;min-height:86px;padding:16px 8px;border-bottom:1px solid #514735}
.credits-no{color:#c39a51;font:12px/1 ui-monospace,monospace}
.credits-name{color:#f5ecd9;font-size:17px;font-weight:750;letter-spacing:.1px}
.credits-role{color:#b8aa92;font-size:12px;line-height:1.7}
.credits-row:first-child .credits-name{color:#f2c66b}
.credits-row:hover{background:rgba(245,236,217,.035)}
.credits-bottom{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:26px}
.credits-note{color:#827969;font-size:11px;line-height:1.7}
.credits-back{display:inline-flex;align-items:center;gap:9px;padding:10px 14px;border:2px solid #080808;background:#efa02c;color:#211d15;text-decoration:none;font-size:12px;font-weight:850;box-shadow:3px 3px 0 #080808;transition:transform .14s,box-shadow .14s}
.credits-back:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 #080808}
@media(max-width:600px){.credits-page{width:calc(100% - 32px);padding-top:30px}.credits-heading{margin:40px 0 25px}.credits-row{grid-template-columns:34px 1fr;gap:8px 12px;min-height:76px;padding:13px 5px}.credits-role{grid-column:2}.credits-bottom{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main class="credits-page">
<nav class="credits-nav"><span>宫水.com　/　创作档案</span><a href="./index.html">返回首页　↗</a></nav>
<header class="credits-heading">
<p class="credits-eyebrow">CREDITS</p>
<h1>创作名单</h1>
<p>这里记录参与网站建设与作品创作的伙伴。感谢每一次认真投入，让这些想法最终成为看得见、能体验的作品。</p>
</header>
<section class="credits-list" aria-label="创作名单">
<div class="credits-row"><span class="credits-no">01</span><span class="credits-name">GSvegetable</span><span class="credits-role">宫水 · 项目发起、产品构思、设计与开发</span></div>
<div class="credits-row"><span class="credits-no">02</span><span class="credits-name">ChatGPT</span><span class="credits-role">方案讨论、工程实现与细节优化</span></div>
<div class="credits-row"><span class="credits-no">03</span><span class="credits-name">DeepSeek</span><span class="credits-role">AI 协作伙伴</span></div>
<div class="credits-row"><span class="credits-no">04</span><span class="credits-name">Claude</span><span class="credits-role">AI 协作伙伴</span></div>
<div class="credits-row"><span class="credits-no">05</span><span class="credits-name">Ludion-ai</span><span class="credits-role">像素昼夜开关 · 海边灯塔场景协作</span></div>
</section>
<footer class="credits-bottom"><span class="credits-note">宫水.com<br>独立创作与持续更新</span><a class="credits-back" href="./index.html">← 回到作品主页</a></footer>
</main>
</body>
</html>
