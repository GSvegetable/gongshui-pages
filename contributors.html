<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171717">
<title>创作名单 | 宫水.com</title>
<meta name="description" content="宫水.com 的开发者与贡献者名单。">
<link rel="stylesheet" href="./styles/style.css?v=3.3.31">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<style>
.credits-page{width:min(760px,calc(100% - 40px));margin:0 auto;padding:clamp(30px,6vh,64px) 0 60px}

.credits-nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:14px;border-bottom:3px solid #080808;color:#a99b82;font:900 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3px}
.credits-nav a{color:#f4bd3c;text-decoration:none}
.credits-nav a:hover{color:#ffd36a}

.credits-heading{margin:52px 0 30px}
.credits-kicker{margin:0 0 12px;color:#f4bd3c;font:900 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2.4px}
.credits-heading h1{margin:0;color:#f4f0e8;font-size:clamp(32px,6vw,54px);font-weight:900;letter-spacing:-1.8px;line-height:1.08}
.credits-heading p:last-child{max-width:460px;margin:18px 0 0;color:#b8aa92;font-size:13px;line-height:1.95}

/* 一格一格：每个人一格，点开往下看他的作品 */
.credits-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.credit-cell{border:3px solid #080808;border-radius:3px;background:#f5ecd9;box-shadow:3px 4px 0 #080808;overflow:hidden}
.credit-cell[open]{box-shadow:3px 4px 0 #080808}
.credit-cell>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 15px;cursor:pointer;list-style:none;color:#211d15;font:900 13px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2px;user-select:none}
.credit-who{display:flex;flex-direction:column;gap:5px;min-width:0}
.credit-cell>summary::-webkit-details-marker{display:none}
.credit-cell>summary:hover{background:#fff8e9}
.credit-cell>summary:focus-visible{outline:2px solid #f4bd3c;outline-offset:-3px}
.credit-chevron{flex:0 0 auto;width:12px;height:12px;border-right:3px solid #211d15;border-bottom:3px solid #211d15;transform:rotate(45deg) translate(-2px,-2px);transition:transform .18s cubic-bezier(.22,.8,.2,1)}
.credit-cell[open] .credit-chevron{transform:rotate(-135deg) translate(-2px,-2px)}
.credit-role{display:block;color:#8a7a5c;font:700 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3px}
.credit-name{font-size:14px}

.credit-works{display:grid;gap:0;margin:0;padding:0;border-top:3px solid #080808;list-style:none}
.credit-works li{display:grid;gap:3px;padding:12px 15px;border-bottom:1px solid rgba(41,35,25,.16)}
.credit-works li:last-child{border-bottom:0}
.credit-works a{color:#211d15;text-decoration:none;font:900 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2px}
.credit-works a:hover{color:#a46b0e}
.credit-works span{color:#6b5d47;font-size:11px;line-height:1.6}

.credits-bottom{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:28px}
.credits-note-foot{color:#827969;font:700 11px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3px}
.credits-back{display:inline-flex;align-items:center;gap:9px;padding:11px 15px;border:3px solid #080808;border-radius:3px;background:#f4bd3c;color:#211d15;text-decoration:none;font:900 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.25px;box-shadow:3px 4px 0 #080808;transition:transform .1s,box-shadow .1s,background .15s}
.credits-back:hover{transform:translate(1px,2px);box-shadow:2px 2px 0 #080808;background:#ffd36a}
.credits-back:active{transform:translate(3px,4px);box-shadow:none}

@media(max-width:640px){
  .credits-page{width:calc(100% - 32px);padding-top:24px}
  .credits-heading{margin:40px 0 26px}
  .credits-grid{grid-template-columns:1fr}
  .credits-bottom{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<main class="credits-page">
  <nav class="credits-nav"><span>宫水.com　/　创作名单</span><a href="./index.html">返回首页　↗</a></nav>

  <header class="credits-heading">
    <p class="credits-kicker">CREDITS</p>
    <h1>创作名单</h1>
    <p>参与这些作品的人。点开名字，看他做的作品。</p>
  </header>

  <section class="credits-grid" aria-label="创作名单">
    <details class="credit-cell" open>
      <summary>
        <span class="credit-who">
          <span class="credit-name">GSvegetable</span>
          <span class="credit-role">项目发起 · 设计与开发</span>
        </span>
        <span class="credit-chevron" aria-hidden="true"></span>
      </summary>
      <ul class="credit-works">
        <li>
          <a href="https://github.com/GSvegetable/pixel-daylight-switch" target="_blank" rel="noopener noreferrer">像素昼夜开关 ↗</a>
          <span>折射玻璃里的微缩像素世界，白天到夜晚的连续过渡</span>
        </li>
        <li>
          <a href="https://github.com/GSvegetable/-pixel-orbit" target="_blank" rel="noopener noreferrer">像素圆环 ↗</a>
          <span>会随时间流动的像素小世界，田园 / 星球 / 环形世界三种视觉</span>
        </li>
      </ul>
    </details>

    <details class="credit-cell">
      <summary>
        <span class="credit-who">
          <span class="credit-name">Ludion-ai</span>
          <span class="credit-role">协作开发者</span>
        </span>
        <span class="credit-chevron" aria-hidden="true"></span>
      </summary>
      <ul class="credit-works">
        <li>
          <a href="https://github.com/GSvegetable/pixel-daylight-switch" target="_blank" rel="noopener noreferrer">像素昼夜开关 · 海边灯塔 ↗</a>
          <span>海边灯塔场景的协作实现</span>
        </li>
      </ul>
    </details>
  </section>

  <footer class="credits-bottom">
    <span class="credits-note-foot">宫水.com<br>独立创作与持续更新</span>
    <a class="credits-back" href="./index.html">← 回到作品主页</a>
  </footer>
</main>
</body>
</html>
