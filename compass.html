<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171717">
<title>指南针 | 宫水.com</title>
<meta name="description" content="宫水.com 的指南针页面，内容建设中。">
<link rel="stylesheet" href="./styles/style.css?v=3.3.27">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
<style>
.compass-page{width:min(720px,calc(100% - 40px));margin:0 auto;padding:clamp(30px,6vh,64px) 0 60px}

.compass-nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:14px;border-bottom:3px solid #080808;color:#a99b82;font:900 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3px}
.compass-nav a{color:#f4bd3c;text-decoration:none}
.compass-nav a:hover{color:#ffd36a}

.compass-heading{margin:52px 0 34px}
.compass-kicker{margin:0 0 12px;color:#f4bd3c;font:900 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2.4px}
.compass-heading h1{margin:0;color:#f4f0e8;font-size:clamp(32px,6vw,54px);font-weight:900;letter-spacing:-1.8px;line-height:1.08}
.compass-heading p:last-child{max-width:460px;margin:18px 0 0;color:#b8aa92;font-size:13px;line-height:1.95}

.compass-block{display:grid;place-items:center;width:74px;height:74px;margin:0 0 28px;border:3px solid #34220e;border-radius:5px;background:#ffd400;color:#1b2146;box-shadow:0 5px 0 #b58f00,0 7px 0 #34220e}
.compass-block svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.compass-bottom{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:34px}
.compass-note{color:#827969;font:700 11px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3px}
.compass-back{display:inline-flex;align-items:center;gap:9px;padding:11px 15px;border:3px solid #080808;border-radius:3px;background:#f4bd3c;color:#211d15;text-decoration:none;font:900 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.25px;box-shadow:3px 4px 0 #080808;transition:transform .1s,box-shadow .1s,background .15s}
.compass-back:hover{transform:translate(1px,2px);box-shadow:2px 2px 0 #080808;background:#ffd36a}
.compass-back:active{transform:translate(3px,4px);box-shadow:none}

@media(max-width:640px){
  .compass-page{width:calc(100% - 32px);padding-top:24px}
  .compass-heading{margin:40px 0 26px}
  .compass-bottom{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<main class="compass-page">
  <nav class="compass-nav"><span>宫水.com　/　指南针</span><a href="./index.html">返回首页　↗</a></nav>

  <header class="compass-heading">
    <div class="compass-block" aria-hidden="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
    </div>
    <p class="compass-kicker">COMPASS</p>
    <h1>指南针</h1>
    <p>这一页还在建设中，内容待定。</p>
  </header>

  <footer class="compass-bottom">
    <span class="compass-note">宫水.com<br>独立创作与持续更新</span>
    <a class="compass-back" href="./index.html">← 回到作品主页</a>
  </footer>
</main>
</body>
</html>
