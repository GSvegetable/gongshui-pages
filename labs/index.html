<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5ecd9">
  <title>作品实验室 | 宫水.com</title>
  <style>
    :root{color-scheme:light;--paper:#f5ecd9;--ink:#211d15;--yellow:#f4bd3c;--muted:#786b56}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    .shell{width:min(1080px,calc(100% - 36px));margin:0 auto;padding:26px 0 64px}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:34px}
    .brand{font-size:12px;font-weight:900;letter-spacing:2px}
    .back{display:inline-flex;align-items:center;gap:8px;color:var(--ink);font-size:12px;font-weight:900;text-decoration:none;border:2px solid var(--ink);padding:9px 12px;background:#fffaf0;box-shadow:3px 3px 0 var(--ink)}
    .eyebrow{font-size:10px;font-weight:900;letter-spacing:2px;color:#8a6b31}
    h1{font-size:clamp(30px,6vw,58px);line-height:1.05;letter-spacing:-2px;margin:12px 0 10px}
    .subtitle{color:var(--muted);font-size:12px;line-height:1.8;max-width:680px}
    .stage{position:relative;overflow:hidden;margin:28px 0 22px;min-height:260px;aspect-ratio:16/9;background:#101318;border:3px solid var(--ink);box-shadow:7px 7px 0 var(--ink)}
    .stage iframe,.stage [data-live-preview],.stage [data-embed-fill]{position:absolute;inset:0;width:100%;height:100%;border:0}
    .stage iframe{display:block}
    .stage [data-live-preview],.stage [data-embed-fill]{display:block}
    .panel{border:2px solid var(--ink);background:#fffaf0;padding:18px;margin:22px 0;box-shadow:4px 4px 0 var(--ink)}
    .panel h2{font-size:14px;margin:0 0 14px;letter-spacing:.4px}
    .controls{display:flex;flex-wrap:wrap;gap:10px}
    button,select{font:800 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);background:#fffaf0;border:2px solid var(--ink);border-radius:2px;min-height:38px;padding:8px 12px;cursor:pointer}
    button:hover{background:#ffe6a5}
    button[aria-pressed=true],button.active{background:var(--yellow);box-shadow:2px 2px 0 var(--ink)}
    .settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}
    .setting{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;border-bottom:1px solid #ded3bd;font-size:12px;font-weight:800}
    .setting select{max-width:58%;min-width:120px}
    .setting input{width:18px;height:18px;accent-color:#d99b20}
    .note{font-size:11px;line-height:1.8;color:var(--muted);margin:14px 0 0}
    .status{font-size:11px;font-weight:800;color:#6d5628;margin-top:12px;min-height:18px}
    .footer{font-size:10px;color:var(--muted);margin-top:38px;letter-spacing:.5px}
    @media(max-width:620px){.shell{width:min(100% - 24px,1080px);padding-top:16px}.topline{margin-bottom:26px}.stage{aspect-ratio:4/5;min-height:300px}.settings{grid-template-columns:1fr}.panel{padding:14px}.setting select{max-width:60%}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="topline"><span class="brand">宫水.com / WORK LAB</span><a class="back" href="../">← 返回作品集</a></div>
    <header><div class="eyebrow">INTERACTION LABORATORY</div><h1 id="title">作品实验室</h1><p class="subtitle" id="description">在这里调整作品参数，直接观察交互变化。</p></header>
    <div class="stage" id="stage" aria-label="作品实时预览"></div>
    <section class="panel" id="controls-panel"><h2 id="controls-title">交互设置</h2><div id="controls"></div><p class="note" id="note">所有设置仅作用于当前预览，不会修改作品源码，也不会影响其他访问者。</p><p class="status" id="status" role="status" aria-live="polite"></p></section>
    <div class="footer">GONGSHUI.COM · EXPERIMENT, OBSERVE, REFINE.</div>
  </main>
<script>
(() => {
  const ROOT='https://gsvegetable.github.io/gongshui-open-source/';
  const params=new URLSearchParams(location.search);
  const id=params.get('work')||'navigation-system';
  const $=s=>document.querySelector(s);
  const stage=$('#stage'),controls=$('#controls'),status=$('#status');
  const setHeader=(title,desc)=>{$('#title').textContent=title;$('#description').textContent=desc;document.title=title+' · 实验室 | 宫水.com'};
  const button=(label,value,active=false)=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.dataset.value=value;if(active)b.classList.add('active');return b};
  const setStatus=t=>status.textContent=t;
  let api=null;
  const loadEmbed=(kind,path,attrs={})=>{
    const mount=document.createElement('div');mount.dataset[kind+'Embed']='';mount.dataset.embedFill='';mount.style.cssText='position:absolute;inset:0;width:100%;height:100%';
    if(kind==='contributorsGlobe')mount.setAttribute('data-contributors-globe-embed','');
    if(kind==='bookmarkHall')mount.setAttribute('data-bookmark-hall-embed','');
    if(kind==='navigationInteraction')mount.setAttribute('data-navigation-interaction-embed','');
    stage.appendChild(mount);
    const script=document.createElement('script');script.src=ROOT+path;
    Object.entries(attrs).forEach(([k,v])=>script.setAttribute(k,v));
    document.body.appendChild(script);
  };
  window.addEventListener('gongshui:embed:ready',event=>{
    const d=event.detail||{};api=d.api||null;
    if(!api)return;
    Promise.resolve(api.ready).then(ok=>{
      if(!ok)return setStatus('作品载入失败，请刷新后重试。');
      if(id==='navigation-system')applyNavigation();
      if(id==='contributors-globe')setStatus('预览已就绪。可切换地球昼夜状态。');
      if(id==='bookmarks-corridor')setStatus('预览已就绪。可在画面中自由探索长廊。');
    }).catch(()=>setStatus('作品载入失败，请刷新后重试。'));
  });
  if(id==='pixel-daylight-switch'){
    setHeader('像素昼夜开关','选择不同的微缩场景，观察开关中的像素世界如何随昼夜变化。');
    const frame=document.createElement('iframe');frame.src=ROOT+'pixel-daylight-switch/preview.html';frame.title='像素昼夜开关实时预览';frame.allow='fullscreen';stage.appendChild(frame);
    const choices=[['乡间小屋','countryside'],['日式街道','japanese-street'],['现代公寓','apartment'],['海边灯塔','seaside'],['山间木屋','mountain-cabin']];
    choices.forEach(([label,value],i)=>{const b=button(label,value,value==='seaside');controls.appendChild(b);b.addEventListener('click',()=>{controls.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));frame.contentWindow.postMessage({type:'pds-set-scene',scene:value},'https://gsvegetable.github.io');setStatus('已切换至：'+label);});});
    setStatus('默认场景：海边灯塔。');
  }else if(id==='pixel-orbit'){
    setHeader('像素圆环','切换星球、田园与环形世界版本，观察不同构图中的昼夜轨道。');
    const frame=document.createElement('iframe');frame.src=ROOT+'showcase.html?v=1.3.9&scene=planet&composition=art';frame.title='像素圆环实时预览';frame.allow='fullscreen';stage.appendChild(frame);
    [['星球版','planet'],['田园版','countryside'],['环形世界版','world']].forEach(([label,value],i)=>{const b=button(label,value,i===0);controls.appendChild(b);b.addEventListener('click',()=>{controls.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));frame.src=ROOT+'showcase.html?v=1.3.9&scene='+value+'&composition=art';setStatus('已切换至：'+label);});});
    setStatus('默认版本：星球版。');
  }else if(id==='contributors-globe'){
    setHeader('投稿者地球实验室','探索投稿者地球，并切换昼夜主题。此处不包含投稿入口，也不会向站点提交数据。');
    loadEmbed('contributorsGlobe','contributors-globe/embed.js?v=1.3.2',{'data-flag':'0','data-search':'0','data-controls':'0','data-contributors-src':'https://xn--3bts89a.com/assets/data/contributors-globe.json'});
    const b=button('切换至夜晚','night');controls.appendChild(b);b.addEventListener('click',()=>{const night=b.dataset.mode!=='night';b.dataset.mode=night?'night':'day';b.textContent=night?'切换至白天':'切换至夜晚';b.setAttribute('aria-pressed',String(night));api?.setNight?.(night);setStatus(night?'已切换至夜晚主题。':'已切换至白天主题。');});
  }else if(id==='bookmarks-corridor'){
    setHeader('收藏长廊实验室','在这里直接探索长廊空间。当前预览不读取你的账号收藏；需要展示内容时，由嵌入方主动传入数据。');
    loadEmbed('bookmarkHall','bookmark-hall/embed.js?v=1.1.2',{'data-controls':'0'});
    $('#controls-title').textContent='空间探索';
    $('#note').textContent='使用作品画面自身提供的移动与视角交互。长廊不会读取访问者账号或自动提交任何数据。';
    controls.textContent='此作品暂无额外参数。直接在上方预览中探索即可。';
  }else{
    setHeader('导航交互系统实验室','调整 24 枚像素按钮的颜色、点击动画、按压反馈与按钮联动，并实时预览效果。');
    loadEmbed('navigationInteraction','navigation-interaction/embed.js?v=1.4.2');
    controls.className='settings';
    const rows=[
      ['图标颜色','select','iconColor',[['黑色','black'],['白色','white']]],
      ['点击动画','check','animations',[]],
      ['按压反馈','select','clickBehavior',[['仅播放动画','none'],['按下后保持','hold'],['按下后自动弹起','rebound']]],
      ['弹起延迟','select','reboundDelay',[['120 毫秒','120'],['240 毫秒','240'],['360 毫秒','360'],['600 毫秒','600'],['1 秒','1000'],['1.5 秒','1500']]],
      ['按钮联动','select','groupBehavior',[['独立状态','independent'],['互斥状态','exclusive']]]
    ];
    rows.forEach(([label,type,key,opts])=>{
      const row=document.createElement('label');row.className='setting';const name=document.createElement('span');name.textContent=label;row.appendChild(name);
      let input;
      if(type==='check'){input=document.createElement('input');input.type='checkbox';input.checked=true;}
      else{input=document.createElement('select');opts.forEach(([t,v])=>{const o=document.createElement('option');o.textContent=t;o.value=v;input.appendChild(o);});input.value=({iconColor:'black',clickBehavior:'rebound',reboundDelay:'360',groupBehavior:'exclusive'})[key];}
      input.dataset.key=key;input.addEventListener('change',applyNavigation);row.appendChild(input);controls.appendChild(row);
    });
    const reset=button('恢复默认','reset');reset.addEventListener('click',()=>{controls.querySelector('[data-key=iconColor]').value='black';controls.querySelector('[data-key=animations]').checked=true;controls.querySelector('[data-key=clickBehavior]').value='rebound';controls.querySelector('[data-key=reboundDelay]').value='360';controls.querySelector('[data-key=groupBehavior]').value='exclusive';api?.reset?.();applyNavigation();setStatus('已恢复默认设置。');});controls.appendChild(reset);
  }
  function applyNavigation(){
    if(id!=='navigation-system')return;
    const value=k=>controls.querySelector('[data-key='+k+']');
    const config={iconColor:value('iconColor')?.value==='white'?'white':'black',animations:!!value('animations')?.checked,clickBehavior:value('clickBehavior')?.value||'rebound',reboundDelay:Number(value('reboundDelay')?.value||360),groupBehavior:value('groupBehavior')?.value||'exclusive'};
    const delay=value('reboundDelay')?.closest('.setting');if(delay)delay.hidden=config.clickBehavior!=='rebound';
    const group=value('groupBehavior');if(group)group.disabled=config.clickBehavior==='none';
    api?.configure?.(config);
    setStatus(api?'设置已应用。点击上方按钮查看效果。':'设置已保存，等待预览载入。');
  }
})();
</script>
</body>
</html>
