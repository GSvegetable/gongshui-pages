<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="点击查看项目目录" xmlns:c2pa="http://c2pa.org/manifest">
  <title>点击查看项目目录</title>
  <style>
    .bg    { fill: #EEF2F7; }
    .ink   { fill: #14213D; }
    .accent{ fill: #2F5BFF; }
    .ring  { fill: none; stroke: #2F5BFF; stroke-width: 3; }
    .tip   { stroke: #EEF2F7; stroke-width: 3; stroke-linejoin: round; }
    text   { font-family: "Inter","SF Pro Display","Segoe UI",Helvetica,Arial,"Hiragino Sans","PingFang SC","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif; }
    .label { font-size: 76px; font-weight: 800; letter-spacing: 2px; }
    .ring  { transform-box: fill-box; transform-origin: center; animation: ripple 2.8s ease-out infinite; }
    .ring.b{ animation-delay: .35s; }
    .ptr   { animation: press 2.8s ease-in-out infinite; }
    @keyframes ripple { 0% { transform: scale(.15); opacity: .8; } 70%,100% { transform: scale(1); opacity: 0; } }
    @keyframes press  { 0%,100% { transform: translate(0,0); } 6% { transform: translate(2px,3px); } 16% { transform: translate(0,0); } }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0E1730; }
      .ink   { fill: #F2F5FB; }
      .accent{ fill: #7C9BFF; }
      .ring  { stroke: #7C9BFF; }
      .tip   { stroke: #0E1730; }
    }
    @media (prefers-reduced-motion: reduce) { .ring, .ptr { animation: none; } .ring { opacity: 0; } }
  </style>

  <rect class="bg" width="1200" height="220" rx="20"/>

  <g transform="translate(235,0)">
    <rect class="accent" x="0" y="64" width="7" height="86" rx="3.5"/>
    <text class="label ink" x="30" y="132" xml:lang="zh" lang="zh">点击查看项目目录</text>

    <!-- click point sits just after the text -->
    <circle class="ring" cx="722" cy="118" r="52"/>
    <circle class="ring b" cx="722" cy="118" r="52"/>
    <g class="ptr">
      <path class="accent tip" transform="translate(722,118) scale(1.15)" d="M0 0 L0 44 L12 33 L21 54 L30 50 L21 30 L37 30 Z"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
