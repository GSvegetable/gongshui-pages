<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="点击体验像素昼夜开关 / クリックして Pixel Daylight Switch を体験">
  <title>点击体验像素昼夜开关 · Pixel Daylight Switch を体験</title>
  <defs>
    <clipPath id="card-clip"><rect width="1200" height="220" rx="20"/></clipPath>
    <linearGradient id="shine-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".48" stop-color="#FFFFFF" stop-opacity=".08"/>
      <stop offset=".52" stop-color="#FFFFFF" stop-opacity=".72"/>
      <stop offset=".56" stop-color="#FFFFFF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .bg { fill: #EEF2F7; }
    .ink { fill: #14213D; }
    .accent { fill: #2F5BFF; }
    text { font-family: "Inter","SF Pro Display","Segoe UI",Helvetica,Arial,"Hiragino Sans","Yu Gothic","PingFang SC","Noto Sans CJK JP","Noto Sans CJK SC","Microsoft YaHei",sans-serif; }
    .label { font-size: 62px; font-weight: 800; letter-spacing: 2px; }
    .sub-label { font-size: 34px; font-weight: 650; letter-spacing: 1px; }
    .shine { animation: sweep 3.4s linear infinite; }
    @keyframes sweep {
      0% { transform: translateX(-420px); animation-timing-function: cubic-bezier(.12,.72,.22,1); }
      22% { transform: translateX(-120px); animation-timing-function: cubic-bezier(.4,0,.6,1); }
      78% { transform: translateX(220px); animation-timing-function: cubic-bezier(.78,0,.88,.28); }
      100% { transform: translateX(1620px); }
    }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0E1730; }
      .ink { fill: #F2F5FB; }
      .accent { fill: #7C9BFF; }
    }
    @media (prefers-reduced-motion: reduce) { .shine { animation: none; opacity: 0; } }
  </style>
  <g clip-path="url(#card-clip)">
    <rect class="bg" width="1200" height="220" rx="20"/>
    <rect class="accent" x="185" y="60" width="3.5" height="100" rx="1.75"/>
    <text class="label ink" x="215" y="105" xml:lang="zh" lang="zh">点击体验像素昼夜开关</text>
    <text class="sub-label ink" x="217" y="158" xml:lang="ja" lang="ja">クリックして Pixel Daylight Switch を体験</text>
    <g class="shine"><path d="M-150 0 H-45 L175 220 H70 Z" fill="url(#shine-gradient)"/></g>
  </g>
</svg>